version: '3.8'

services:
  gracenote2xmltv:
    build: .
    container_name: gracenote2xmltv
    image: gracenote2xmltv:latest
    ports:
      - "${GRACENOTE_PORT:-${TVTV_PORT:-8080}}:8080"
    environment:
      - GRACENOTE_TIMEZONE=${GRACENOTE_TIMEZONE:-${TVTV_TIMEZONE:-America/Phoenix}}
      - GRACENOTE_LINEUPS=${GRACENOTE_LINEUPS:-${TVTV_LINEUPS:-85142_OTA}}
      - GRACENOTE_LINEUP_ID=${GRACENOTE_LINEUP_ID:-${TVTV_LINEUP_ID:-85142_OTA}}
      - GRACENOTE_DEFAULT_LINEUP=${GRACENOTE_DEFAULT_LINEUP:-${TVTV_DEFAULT_LINEUP:-85142_OTA}}
      - GRACENOTE_DAYS=${GRACENOTE_DAYS:-${TVTV_DAYS:-8}}
      - GRACENOTE_UPDATE_INTERVAL=${GRACENOTE_UPDATE_INTERVAL:-${TVTV_UPDATE_INTERVAL:-3600}}
      - GRACENOTE_PORT=8080
      - GRACENOTE_HOST=0.0.0.0
      - TVTV_TIMEZONE=${GRACENOTE_TIMEZONE:-${TVTV_TIMEZONE:-America/Phoenix}}
      - TVTV_LINEUPS=${GRACENOTE_LINEUPS:-${TVTV_LINEUPS:-85142_OTA}}
      - TVTV_LINEUP_ID=${GRACENOTE_LINEUP_ID:-${TVTV_LINEUP_ID:-85142_OTA}}
      - TVTV_DEFAULT_LINEUP=${GRACENOTE_DEFAULT_LINEUP:-${TVTV_DEFAULT_LINEUP:-85142_OTA}}
      - TVTV_DAYS=${GRACENOTE_DAYS:-${TVTV_DAYS:-8}}
      - TVTV_UPDATE_INTERVAL=${GRACENOTE_UPDATE_INTERVAL:-${TVTV_UPDATE_INTERVAL:-3600}}
      - TVTV_PORT=8080
      - TVTV_HOST=0.0.0.0
    volumes:
      - xmltv-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  xmltv-data:
